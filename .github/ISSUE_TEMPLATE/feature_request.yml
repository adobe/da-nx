name: Feature request
description: Suggest a new capability or an improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Fields marked required drive our triage automation
        (scope labeling and the completeness check). A bot will tag you if
        anything required is missing.

  - type: dropdown
    id: scope
    attributes:
      label: Scope / Area
      description: Which part of the product does this touch?
      options:
        - Editor / Canvas
        - Blocks / Rendering
        - Config / Sheets
        - Auth / Permissions
        - AI Assistant / Agent
        - MCP / Tooling
        - Infra / CI
        - Docs
        - Other / Unsure
    validations:
      required: true

  - type: dropdown
    id: affected
    attributes:
      label: Who is affected?
      description: Is this customer-facing or internal?
      options:
        - Customer-facing
        - Internal
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: false
